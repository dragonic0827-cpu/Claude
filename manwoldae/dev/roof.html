<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지붕 확인</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>html,body{margin:0;height:100%;background:#222}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createMaterials } from '../src/core/materials.js';
import { RoofShape, buildRoofSurfaces, ridgeLines, ridgeTube } from '../src/arch/roof.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb6c8');
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
cam.position.set(20, 22, 48);
const ctl = new OrbitControls(cam, renderer.domElement); ctl.target.set(0, 3, 0); ctl.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x445544, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(20, 30, 25); scene.add(sun);
scene.add(new THREE.GridHelper(80, 40, 0x444444, 0x666666));
const m = createMaterials();
function roof(type, a, b, H, x, tileMat) {
  const shape = new RoofShape({ type, halfWidth: a, halfDepth: b, height: H });
  const s = buildRoofSurfaces(shape);
  const g = new THREE.Group();
  for (const geo of s.top) g.add(new THREE.Mesh(geo, tileMat));
  for (const geo of s.under) g.add(new THREE.Mesh(geo, m.roofUnder));
  for (const geo of s.edge) g.add(new THREE.Mesh(geo, m.ridgeGray));
  for (const geo of s.gable) g.add(new THREE.Mesh(geo, m.woodRed));
  for (const l of ridgeLines(shape)) {
    const lifted = l.pts.map(p => p.clone().add(new THREE.Vector3(0, 0.2, 0)));
    g.add(new THREE.Mesh(ridgeTube(lifted, l.kind === 'main' ? 0.7 : 0.45, l.kind === 'main' ? 0.9 : 0.5), m.ridgeGray));
  }
  g.position.set(x, 2, 0);
  scene.add(g);
}
roof('hip-gable', 12, 7, 4.6, -14, m.tileCeladon);
roof('hip', 6, 4.5, 3.2, 8, m.tileGray);
roof('gable', 5, 4, 2.8, 22, m.tileGray);
window.__views = {
  front: () => { cam.position.set(0, 8, 45); ctl.target.set(0, 4, 0); ctl.update(); },
  side: () => { cam.position.set(50, 6, 0); ctl.target.set(0, 4, 0); ctl.update(); },
  top: () => { cam.position.set(0, 60, 1); ctl.target.set(0, 0, 0); ctl.update(); },
  below: () => { cam.position.set(-14, 0.5, 14); ctl.target.set(-14, 6, 0); ctl.update(); },
};
renderer.setAnimationLoop(() => renderer.render(scene, cam));
window.__ready = true;
</script>
</body>
</html>
