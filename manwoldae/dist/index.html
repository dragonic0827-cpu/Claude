<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滿月臺 · 고려 개경 만월대 3D 복원</title>
<meta name="description" content="1123년 송나라 사신 서긍이 본 고려 본궐, 개경 만월대를 발굴 자료와 『고려도경』으로 다시 세운 3D 복원">
<meta name="theme-color" content="#15191b">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script>
  // 글꼴(Google Fonts: Song Myung · Gowun Dodum). 자동화 도구로 여는 점검에서는 외부 요청을 건너뜁니다(?fonts=1 로 강제).
  (function () {
    if (navigator.webdriver && !/[?&]fonts=1/.test(location.search)) return;
    var d = document, head = d.head;
    var add = function (rel, href, cors) {
      var l = d.createElement('link');
      l.rel = rel; l.href = href;
      if (cors) l.crossOrigin = '';
      head.appendChild(l);
    };
    add('preconnect', 'https://fonts.googleapis.com');
    add('preconnect', 'https://fonts.gstatic.com', true);
    add('stylesheet', 'https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Song+Myung&display=swap');
  })();
</script>
<style>
/* 만월대 3D — 먹(墨) 칠 패널 · 비색(翡色) 강조 · 금박 가는 선 · 주칠은 작은 상태 표시에만 */
:root {
  --ink: #15191b;
  --panel: rgba(21, 25, 27, 0.82);
  --panel-strong: rgba(18, 22, 24, 0.9);
  --hair: rgba(236, 230, 216, 0.09);
  --hair-2: rgba(236, 230, 216, 0.16);
  --gilt: #c8a245;
  --gilt-line: rgba(200, 162, 69, 0.62);
  --celadon: #8fb8a6;
  --celadon-hi: #b9d6c8;
  --celadon-dim: rgba(143, 184, 166, 0.15);
  --cinnabar: #b8322a;
  --paper: #ece6d8;
  --text: #e2ddd1;
  --muted: #a7aaa2;
  --faint: #80847e;
  --display: 'Song Myung', 'Noto Serif KR', 'Nanum Myeongjo', 'AppleMyungjo', 'Batang', serif;
  --body: 'Gowun Dodum', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 3px;
  --st: env(safe-area-inset-top, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --dock-h: 60px;
  --top: 104px;
  --blur: blur(16px) saturate(1.12);
  --shadow: 0 16px 44px rgba(4, 6, 8, 0.38), 0 2px 6px rgba(4, 6, 8, 0.25);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--ink);
  color: var(--text);
  font: 15px/1.65 var(--body);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
a { color: var(--celadon-hi); text-decoration-color: rgba(185, 214, 200, 0.4); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--celadon); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 13px; height: 13px; vertical-align: -1px; margin-left: 4px; opacity: 0.7; }

/* ───────── 겹 UI 틀 ───────── */
.ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.ui > * { pointer-events: auto; }
.labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }

/* 표제 (밝은 하늘 위에서도 읽히도록 왼쪽 위를 살짝 어둡게) */
.ui::before {
  content: ''; position: absolute; left: 0; top: 0; width: min(560px, 80vw); height: 200px; pointer-events: none;
  background: radial-gradient(ellipse at 0% 0%, rgba(10, 13, 15, 0.46), rgba(10, 13, 15, 0.18) 42%, transparent 70%);
}
.ui > .brand { pointer-events: none; }
.brand { position: absolute; top: calc(var(--st) + 20px); left: calc(var(--sl) + 24px); color: var(--paper); text-shadow: 0 0 18px rgba(8, 10, 12, 0.55), 0 1px 2px rgba(8, 10, 12, 0.5); }
.brand-title { margin: 0; font: 400 34px/1 var(--display); letter-spacing: 0.14em; }
.brand-sub { margin: 9px 0 0; display: flex; align-items: center; gap: 10px; font-size: 12.5px; letter-spacing: 0.1em; color: rgba(236, 230, 216, 0.82); }
.brand-sub::before { content: ''; width: 20px; height: 1px; background: var(--gilt); box-shadow: 0 0 6px rgba(200, 162, 69, 0.5); }
.brand-year { font-family: var(--display); letter-spacing: 0.06em; color: var(--gilt); text-shadow: 0 0 10px rgba(8, 10, 12, 0.6); }

/* 공통 패널 */
.sheet, .dock, .minimap, .toast, .note, .pop, .hover-tip {
  background: var(--panel);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--hair);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}
.sheet, .dock, .minimap, .pop { border-top-color: var(--gilt-line); }
.eyebrow { font-size: 11.5px; letter-spacing: 0.16em; color: var(--muted); }
.muted { color: var(--muted); font-size: 13.5px; }

.btn { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--text); cursor: pointer; border-radius: 2px; }
.btn:hover:not(:disabled) { background: rgba(236, 230, 216, 0.07); }
.btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn { width: 36px; height: 36px; justify-content: center; }
.text-btn { height: 36px; padding: 0 12px 0 10px; font-size: 13.5px; border: 1px solid var(--hair-2); }
.text-btn[aria-pressed='true'] { color: var(--celadon-hi); border-color: rgba(143, 184, 166, 0.45); background: var(--celadon-dim); }

/* ───────── 도구 막대 ───────── */
.dock {
  position: absolute; left: calc(var(--sl) + 16px); bottom: calc(var(--sb) + 16px);
  display: flex; align-items: center; gap: 1px; padding: 5px;
}
.dock-seg { display: flex; gap: 1px; }
.dock-btn, .seg-btn {
  position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-width: 54px; height: 50px; padding: 5px 8px 4px; border: 0; border-radius: 2px; background: transparent;
  color: rgba(226, 221, 209, 0.86); font-size: 11.5px; line-height: 1; letter-spacing: 0.02em; cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.dock-btn:hover, .seg-btn:hover { background: rgba(236, 230, 216, 0.07); color: var(--paper); }
.dock-btn[aria-pressed='true'], .dock-btn[aria-expanded='true'] { color: var(--celadon-hi); background: var(--celadon-dim); }
.dock-btn[aria-pressed='true']::after { content: ''; position: absolute; top: 6px; right: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--cinnabar); box-shadow: 0 0 0 1.5px rgba(21, 25, 27, 0.9); }
.seg-btn[aria-checked='true'] { color: var(--paper); }
.seg-btn[aria-checked='true'] .ico { color: var(--gilt); }
.seg-btn[aria-checked='true']::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 1px; background: var(--gilt); }
.dock-sep { width: 1px; height: 30px; margin: 0 6px; background: var(--hair-2); }
.time-toggle { display: none; }

.pop {
  position: absolute; bottom: calc(100% + 10px); left: 0; min-width: 250px; padding: 8px; display: flex; flex-direction: column; gap: 2px;
  background: var(--panel-strong);
}
.pop-quality { left: auto; right: 0; }
.pop .eyebrow { padding: 4px 8px 6px; }
.pop-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 0; border-radius: 2px; background: transparent; text-align: left; cursor: pointer; color: var(--text); }
.pop-item:hover { background: rgba(236, 230, 216, 0.07); }
.pop-item b { display: block; font-weight: 400; font-size: 14px; }
.pop-item small { display: block; font-size: 12px; color: var(--muted); }
.pop-item[aria-checked='true'], .pop-item.on { background: var(--celadon-dim); }
.pop-item[aria-checked='true'] b, .pop-item.on b { color: var(--celadon-hi); }
.pop-note { margin: 6px 8px 2px; font-size: 12px; color: var(--faint); }

/* ───────── 시트 (패널) ───────── */
.sheet {
  position: absolute; display: flex; flex-direction: column; width: 384px;
  top: calc(var(--st) + var(--top)); max-height: calc(100% - var(--st) - var(--top) - var(--sb) - var(--dock-h) - 44px);
  opacity: 0; transform: translateY(6px); transition: opacity 0.22s ease, transform 0.22s ease;
}
.sheet.in { opacity: 1; transform: none; }
.sheet-left { left: calc(var(--sl) + 16px); }
.sheet-right { right: calc(var(--sr) + 16px); top: calc(var(--st) + 16px); width: 368px; max-height: calc(100% - var(--st) - var(--sb) - 32px); }
body.map-open .sheet-right { max-height: calc(100% - var(--st) - var(--sb) - 32px - var(--map-h, 360px) - 12px); }
@media (max-height: 1040px) and (min-width: 721px) {
  body.sheet-right-open .minimap { display: none; }
  body.map-open .sheet-right { max-height: calc(100% - var(--st) - var(--sb) - 32px); }
}
.sheet-wide { width: 468px; height: calc(100% - var(--st) - var(--top) - var(--sb) - var(--dock-h) - 44px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 8px 0 20px; min-height: 44px; }
.sheet-tools { display: inline-flex; gap: 2px; }
.sheet-min { display: none; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 20px 16px; scrollbar-width: thin; scrollbar-color: rgba(236, 230, 216, 0.2) transparent; }
.sheet-foot { padding: 12px 16px 14px 20px; border-top: 1px solid var(--hair); }
.sheet-title { margin: 2px 0 14px; font: 400 26px/1.25 var(--display); color: var(--paper); letter-spacing: 0.02em; }
.sheet h2:focus { outline: none; }
.sheet-title + .sheet-sub { margin: -8px 0 14px; font-size: 13px; color: var(--muted); }
.group-title { margin: 22px 0 10px; font: 400 16px/1.3 var(--display); color: var(--paper); display: flex; align-items: center; gap: 10px; }
.group-title::after { content: ''; flex: 1; height: 1px; background: var(--hair-2); }

/* 투어 */
.tour-count { margin-left: 6px; font-family: var(--display); letter-spacing: 0.08em; color: var(--gilt); }
.tour-title { margin: 4px 0 12px; font: 400 25px/1.3 var(--display); color: var(--paper); }
.tour-text { margin: 0; font-size: 15px; line-height: 1.8; color: var(--text); word-break: keep-all; }
.tour-dots { list-style: none; display: flex; gap: 4px; margin: 0 0 12px; padding: 0; }
.tour-dots li { flex: 1; }
.tour-dots .dot { display: block; width: 100%; height: 14px; padding: 0; border: 0; background: transparent; cursor: pointer; position: relative; }
.tour-dots .dot::before { content: ''; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--hair-2); transition: background 0.2s; }
.tour-dots .dot.seen::before { background: rgba(200, 162, 69, 0.5); }
.tour-dots .dot.on::before { background: var(--celadon); height: 3px; top: 5.5px; }
.tour-dots .dot:hover::before { background: var(--celadon-hi); }
.tour-progress { height: 1px; margin: -8px 0 10px; background: transparent; overflow: hidden; }
.tour-progress i { display: block; height: 100%; background: var(--gilt); transform-origin: left; transform: scaleX(0); }
.tour-progress:not(.on) { visibility: hidden; }
.tour-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tour-nav .icon-btn { border: 1px solid var(--hair-2); }
.play-ico { display: inline-flex; }

/* 정보 카드 */
.info-name { margin: 2px 0 0; font: 400 30px/1.2 var(--display); color: var(--paper); letter-spacing: 0.04em; }
.info-hanja { margin: 2px 0 12px; font: 400 17px/1.3 var(--display); color: var(--gilt); letter-spacing: 0.2em; }
.info-facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 4px 0 14px; padding: 10px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); font-size: 13.5px; }
.info-facts dt { color: var(--muted); white-space: nowrap; }
.info-facts dd { margin: 0; color: var(--text); word-break: keep-all; }
.info-conf { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.info-conf .conf-note { flex-basis: 100%; font-size: 12px; color: var(--faint); }
.info-desc { margin: 0 0 12px; font-size: 15px; line-height: 1.8; word-break: keep-all; }
.info-more summary { cursor: pointer; font-size: 13px; color: var(--celadon-hi); list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; }
.info-more summary::-webkit-details-marker { display: none; }
.info-more summary::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform 0.15s; }
.info-more[open] summary::before { transform: rotate(45deg); }
.info-notes { margin: 6px 0 0; padding: 10px 12px; font-size: 13px; line-height: 1.7; color: var(--muted); background: rgba(236, 230, 216, 0.04); border-left: 2px solid var(--hair-2); word-break: keep-all; }
.info-actions { display: flex; gap: 8px; }

/* 신뢰도 */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; font-size: 12px; letter-spacing: 0.06em; border-radius: 2px; border: 1px solid; white-space: nowrap; }
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.c-sure { color: var(--celadon-hi); border-color: rgba(143, 184, 166, 0.5); background: rgba(143, 184, 166, 0.1); }
.c-est { color: #dcc07a; border-color: rgba(200, 162, 69, 0.5); background: rgba(200, 162, 69, 0.08); }
.c-unsure { color: #e0968f; border-color: rgba(184, 50, 42, 0.6); background: rgba(184, 50, 42, 0.1); }
.dot-conf { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot-conf.c-sure { background: var(--celadon); }
.dot-conf.c-est { background: var(--gilt); }
.dot-conf.c-unsure { background: var(--cinnabar); }

/* 정보 시트 */
.tabs { display: flex; gap: 2px; margin: 0 -4px 6px; border-bottom: 1px solid var(--hair); }
.tab { padding: 8px 10px 9px; border: 0; background: none; color: var(--muted); font-size: 14px; cursor: pointer; position: relative; }
.tab:hover { color: var(--paper); }
.tab[aria-selected='true'] { color: var(--paper); }
.tab[aria-selected='true']::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--celadon); }
.tab-panel { padding-top: 8px; outline: none; }
.timeline { list-style: none; margin: 8px 0 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.tl-year { font: 400 17px/1.4 var(--display); color: var(--gilt); letter-spacing: 0.04em; }
.tl-body p { margin: 0 0 6px; font-size: 14px; line-height: 1.7; word-break: keep-all; }
.tl-body .conf-note { display: block; margin-top: 4px; font-size: 12px; color: var(--faint); }
.place-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
.place { display: flex; align-items: baseline; gap: 6px; width: 100%; padding: 6px 8px; border: 0; border-radius: 2px; background: none; cursor: pointer; text-align: left; font-size: 13.5px; }
.place:hover { background: rgba(236, 230, 216, 0.07); }
.place-n { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.place-h { font-family: var(--display); font-size: 12px; color: var(--faint); white-space: nowrap; }
.place .dot-conf { align-self: center; margin-right: 2px; }
.dot-conf.c-none { background: transparent; }
.sources { list-style: none; margin: 10px 0 0; padding: 0; }
.sources li { padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; line-height: 1.55; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.legend li { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); }
.legend .badge { min-width: 64px; justify-content: center; }
/* 복원 선택지 스위치 */
.alt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.alt-switch { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--hair-2); border-radius: var(--r); background: rgba(236, 230, 216, 0.03); cursor: pointer; text-align: left; }
.alt-switch:hover { background: rgba(236, 230, 216, 0.07); }
.alt-switch:disabled { opacity: 0.55; cursor: progress; }
.alt-track { position: relative; flex: none; width: 34px; height: 18px; border-radius: 9px; background: rgba(236, 230, 216, 0.16); transition: background 0.2s; }
.alt-track i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); transition: transform 0.2s; }
.alt-switch[aria-checked='true'] .alt-track { background: var(--celadon); }
.alt-switch[aria-checked='true'] .alt-track i { transform: translateX(16px); }
.alt-title { flex: 1 1 auto; font-size: 14px; color: var(--paper); }
.alt-state { flex: none; font-size: 13px; color: var(--muted); }
.alt-switch[aria-checked='true'] .alt-state { color: var(--celadon-hi); }
.alt-note { margin: 6px 2px 0; font-size: 12.5px; line-height: 1.65; color: var(--faint); }
.bullets { margin: 0; padding-left: 18px; }
.bullets li { margin: 0 0 8px; font-size: 14px; line-height: 1.7; word-break: keep-all; }
.bullets li::marker { color: var(--gilt); }
.tab-panel p { word-break: keep-all; }
.keys { width: 100%; border-collapse: collapse; font-size: 14px; }
.keys th { width: 38%; padding: 7px 10px 7px 0; text-align: left; font-weight: 400; color: var(--muted); vertical-align: top; }
.keys td { padding: 7px 0; border-bottom: 1px solid var(--hair); }
.keys tr:first-child td, .keys tr:first-child th { padding-top: 2px; }
kbd { display: inline-block; min-width: 22px; padding: 1px 6px; font: 12px/18px var(--body); text-align: center; color: var(--paper); border: 1px solid var(--hair-2); border-bottom-width: 2px; border-radius: 3px; background: rgba(236, 230, 216, 0.05); }

/* ───────── 이름표 ───────── */
.label {
  position: absolute; left: 0; top: 0; display: inline-flex; align-items: baseline; gap: 6px; margin-top: -12px;
  padding: 3px 9px 4px 8px; border: 0; border-left: 2px solid var(--gilt); border-radius: 1px;
  background: rgba(18, 22, 24, 0.64); color: var(--paper); font: 13px/1.25 var(--body); white-space: nowrap;
  visibility: hidden; cursor: pointer; will-change: transform, opacity;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.label::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 12px; background: linear-gradient(rgba(236, 230, 216, 0.75), rgba(236, 230, 216, 0)); }
.label:hover { background: rgba(18, 22, 24, 0.85); }
.label-h { font: 12px/1 var(--display); color: rgba(236, 230, 216, 0.6); letter-spacing: 0.1em; }
.label.major .label-n { font: 16px/1.2 var(--display); letter-spacing: 0.06em; }
.label-landmark { border-left-color: var(--celadon); }
.label-peak { background: none; border: 0; padding: 0 2px; gap: 5px; -webkit-backdrop-filter: none; backdrop-filter: none; font-size: 12.5px; color: rgba(236, 230, 216, 0.88); text-shadow: 0 0 8px rgba(8, 10, 12, 0.7), 0 1px 2px rgba(8, 10, 12, 0.6); }
.label-peak::after { height: 16px; background: linear-gradient(rgba(236, 230, 216, 0.55), rgba(236, 230, 216, 0)); }
.label-peak .label-n { font-family: var(--display); letter-spacing: 0.08em; }
.label-peak .label-h { font-family: var(--body); font-size: 11px; letter-spacing: 0.02em; }
.label.static { cursor: default; }

.hover-tip { position: absolute; left: 0; top: 0; padding: 4px 10px; font-size: 13px; color: var(--paper); pointer-events: none; white-space: nowrap; box-shadow: none; }

/* ───────── 알림 · 유적 안내 ───────── */
.status { position: absolute; left: calc(var(--sl) + 16px); bottom: calc(var(--sb) + var(--dock-h) + 40px); display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100% - 32px)); pointer-events: none !important; transition: left 0.22s ease; }
body.sheet-left-open .status { left: calc(var(--sl) + 16px + 384px + 14px); }

.loading {

.loading-ridge { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 26vh; }

.loading-title { margin: 0; display: flex; flex-direction: column; gap: 0.12em; font: 400 clamp(52px, 7.4vw, 92px)/1 var(--display); color: var(--paper); text-shadow: 0 0 30px rgba(236, 226, 196, 0.12); }

uC11C \uB0B4\uB824\uB2E4\uBCF8 \uC911\uC2EC\uCD95",camera:{x:50,y:32,z:-232},target:{x:18,y:-4,z:-60},textKo:'\uC911\uC2EC\uCD95\uC5D0\uC11C \uAC00\uC7A5 \uB192\uC740 \uACF3, \uC6D0\uB355\uC804 \uC55E\uC785\uB2C8\uB2E4. \uC655\uC740 \uD3C9\uC18C \uC774\uACF3\uC744 \uC4F0\uC9C0 \uC54A\uB2E4\uAC00 \uC678\uC801\uC774 \uCCD0\uB4E4\uC5B4\uC624\uBA74 \uC5EC\uAE30\uC11C \uAD70\uC0AC\uB97C \uB0B4\uACE0 \uC7A5\uC218\uB97C \uC784\uBA85\uD588\uC2B5\uB2C8\uB2E4. \uB4A4\uB3CC\uC544\uBCF4\uBA74 \uC7A5\uD654\uC804\uACFC \uD68C\uACBD\uC804\uC758 \uC9C0\uBD95\uC774 \uACC4\uB2E8\uCC98\uB7FC \uB0B4\uB824\uAC00\uACE0, \uADF8 \uB108\uBA38\uB85C \uAC1C\uACBD \uB3C4\uC131\uC774 \uD3BC\uCCD0\uC9D1\uB2C8\uB2E4. \uC11C\uAE0D\uC774 "\uC9C0\uC138\uAC00 \uB354\uC6B1 \uB192\uB2E4"\uACE0 \uD55C \uADF8\uB300\uB85C\uC785\uB2C8\uB2E4.'},{id:"geondeokjeon",titleKo:"\uAC74\uB355\uC804\uACFC \uC11C\uBD80 \uAC74\uCD95\uAD70",camera:{x:-58,y:14,z:-70},target:{x:-90,y:2,z:-108},textKo:"\uD68C\uACBD\uC804 \uC11C\uCABD, \uCD95\uB300 \uC544\uB798 \uB0AE\uC740 \uD130\uC5D0\uB294 \uC655\uC774 \uC2E4\uC81C\uB85C \uC0DD\uD65C\uD558\uACE0 \uC815\uBB34\uB97C \uBCF4\uB358 \uC11C\uBD80 \uAC74\uCD95\uAD70\uC774 \uC788\uC2B5\uB2C8\uB2E4. \uADF8 \uB0A8\uCABD\uC758 \uAC74\uB355\uC804\uC740 \uD589\uC0AC\uAC00 \uB4DC\uBB38 \uD68C\uACBD\uC804\uACFC \uB2EC\uB9AC \uC870\uD68C\uC640 \uC989\uC704\uC2DD, \uACFC\uAC70 \uC2DC\uD5D8\uC774 \uC5F4\uB9AC\uB358 \uAC00\uC7A5 \uBC14\uC05C \uC815\uC804\uC774\uC5C8\uC2B5\uB2C8\uB2E4. \uC774 \uC77C\uB300\uB97C \uD0DC\uC870 \uB54C \uCC98\uC74C \uC9C0\uC740 \uAD81\uAD90\uC758 \uC911\uC2EC\uC73C\uB85C \uBCF4\uB294 \uACAC\uD574\uB3C4 \uC788\uC2B5\uB2C8\uB2E4. 2007\uB144\uBD80\uD130 2018\uB144\uAE4C\uC9C0 \uB0A8\uBD81 \uACF5\uB3D9\uC870\uC0AC\uB2E8\uC774 \uC774\uACF3\uC5D0\uC11C \uAC74\uBB3C\uD130 40\uC5EC \uB3D9\uC744 \uCC3E\uC544\uB0C8\uC2B5\uB2C8\uB2E4."},{id:"gyeongnyeongjeon",titleKo:"\uACBD\uB839\uC804, \uC655\uC2E4\uC758 \uC0AC\uB2F9",camera:{x:-78,y:20,z:-180},target:{x:-103,y:9,z:-222}
